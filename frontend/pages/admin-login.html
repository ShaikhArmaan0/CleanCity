<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login – CleanCity</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,var(--green-50) 0%,var(--beige-50) 100%);display:flex;flex-direction:column}
    .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:5.5rem 1rem 2rem}
    .auth-card{background:white;border-radius:var(--radius-xl);box-shadow:0 24px 80px rgba(0,0,0,.10);padding:2.5rem;width:100%;max-width:420px;animation:fadeInUp .45s ease both}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .auth-logo{text-align:center;margin-bottom:1.75rem}
    .auth-logo-icon{width:60px;height:60px;background:var(--green-600);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto .75rem;box-shadow:var(--shadow-green)}
    .auth-logo-text{font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--green-700)}
    .admin-badge{display:inline-block;background:var(--green-100);color:var(--green-700);font-size:0.75rem;font-weight:700;padding:0.2rem 0.75rem;border-radius:var(--radius-full);margin-top:0.4rem;letter-spacing:0.04em}
    .info-box{background:var(--green-50);border:1.5px solid var(--green-200);border-radius:var(--radius-md);padding:.8rem 1rem;font-size:.83rem;color:var(--green-700);margin-bottom:1.5rem;line-height:1.6;text-align:center}
    .err-block{background:#fff5f5;border:1px solid #fed7d7;color:#c53030;border-radius:var(--radius-md);padding:.6rem .9rem;font-size:.83rem;margin-bottom:1rem;display:none}
    .err-block.show{display:block}
    .auth-link-row{text-align:center;font-size:.875rem;color:var(--gray-500);margin-top:1.25rem}
    .auth-link-row a{color:var(--green-600);font-weight:600;text-decoration:underline}
  </style>
</head>
<body>
<nav class="navbar" style="background:white;box-shadow:var(--shadow-sm)">
  <div class="nav-container">
    <a href="index.html" class="nav-logo"><div class="nav-logo-icon">♻</div> CleanCity</a>
    <div style="margin-left:auto">
      <a href="login.html" class="btn btn-ghost btn-sm">← User Login</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🛡️</div>
      <div class="auth-logo-text">Admin Portal</div>
      <div><span class="admin-badge">Restricted Access</span></div>
    </div>

    <div class="info-box">
      Sign in with your <strong>admin email and password</strong>.<br>
      This portal is for authorised admin &amp; authority staff only.
    </div>

    <div class="err-block" id="errBox"></div>

    <div class="form-group">
      <label class="form-label">Admin Email</label>
      <input type="email" id="adminEmail" class="form-input" placeholder="admin@cleancity.gov" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-full" id="loginBtn">Sign In to Admin Panel →</button>

    <div class="auth-link-row"><a href="login.html">← Back to User Login</a></div>
  </div>
</div>

<script src="../js/core/api.config.js?v=12"></script>
<script>
  // Only redirect if admin session (cc_admin_token) exists — NOT user session
  if (AdminAuth.isLoggedIn() && AdminAuth.isAdmin()) {
    window.location.href = 'admin.html';
  }

  const $ = id => document.getElementById(id);
  function showErr(msg) { $('errBox').textContent = msg; $('errBox').classList.add('show'); }
  function hideErr()    { $('errBox').classList.remove('show'); }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const email    = $('adminEmail').value.trim();
    const password = $('adminPassword').value;
    hideErr();
    if (!email || !email.includes('@')) { showErr('Enter a valid email address'); return; }
    if (!password) { showErr('Password is required'); return; }

    const btn = $('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      // Use httpAdmin — stores in cc_admin_token (separate from user cc_token)
      const res = await httpAdmin(API.admin.login, {
        method: 'POST', body: JSON.stringify({ email, password })
      });
      AdminAuth.setSession(res.token, res.user);
      Toast.show('Welcome, ' + res.user.name + '! 🌿');
      setTimeout(() => { window.location.href = 'admin.html'; }, 500);
    } catch (err) {
      showErr(err.message || 'Login failed. Check your credentials.');
      btn.disabled = false; btn.textContent = 'Sign In to Admin Panel →';
    }
  }

  $('loginBtn').addEventListener('click', doLogin);
</script>
</body>
</html>
